name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - 'single_binary_python'
    - 'sample'
    - 'copilot/build-libffi-from-source'

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Install Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: make autoconf automake libtool dejagnu
    
    - name: Set up environment for libffi build
      shell: cmd
      run: |
        echo Setting up libffi environment
        echo SH=C:\cygwin\bin\sh.exe>> %GITHUB_ENV%
    
    - name: Build CPython
      run: cmd /c SingleBinaryBuild.bat
    
    - name: Display build info
      run: .\\python.bat -m test.pythoninfo
    
